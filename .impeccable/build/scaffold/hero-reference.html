<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-d2-hibrida.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f7ea}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:2688px">
  <div class="r-nav-sign region chrome" data-region="nav-sign"><!-- navy overhead hanging corridor sign used as navigation, with two grey ceiling rods --></div>
  <div class="r-logo-mark region chrome" data-region="logo-mark"><!-- white vessel monogram mark DG --></div>
  <div class="r-brand-name region text" data-region="brand-name"><!-- Dr. David García · Cirugía Vascular in white --><p style="font-size:var(--r-brand-name-font);line-height:1.05;margin:0">brand-name</p></div>
  <div class="r-nav-links region text" data-region="nav-links"><!-- Tratamientos, Eco-doppler, El doctor, Blog in white bold --><p style="font-size:var(--r-nav-links-font);line-height:1.05;margin:0">nav-links</p></div>
  <div class="r-nav-cta region control" data-region="nav-cta"><!-- light-blue rounded button Pedir cita: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-cta); a control need not have button chrome --></div>
  <div class="r-headline region text" data-region="headline"><!-- Cirujano vascular en Ciudad Real, two lines extra-bold navy --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subtext region text" data-region="subtext"><!-- Varices, congestión pélvica y mala circulación. Eco-doppler en la misma visita. --><p style="font-size:var(--r-subtext-font);line-height:1.05;margin:0">subtext</p></div>
  <div class="r-btn-llamar region control" data-region="btn-llamar"><!-- navy button with phone icon Llamar: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop btn-llamar); a control need not have button chrome --></div>
  <div class="r-btn-whatsapp region control" data-region="btn-whatsapp"><!-- green button with WhatsApp icon: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop btn-whatsapp); a control need not have button chrome --></div>
  <figure class="r-woman region plate" data-region="woman"><img src="../../../assets/plates/woman.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-floor-line region chrome" data-region="floor-line"><!-- light-blue floor guide line with white dashes along the bottom --></div>
  <div class="r-totem-panel region chrome" data-region="totem-panel"><!-- tall navy directory totem with plinth --></div>
  <div class="r-totem-title region text" data-region="totem-title"><!-- ¿Qué notas? white sign lettering --><p style="font-size:var(--r-totem-title-font);line-height:1.05;margin:0">totem-title</p></div>
  <div class="r-row-varices region control" data-region="row-varices"><!-- leg pictogram, Me pesan las piernas, Varices, arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop row-varices); a control need not have button chrome --></div>
  <div class="r-row-pelvica region control" data-region="row-pelvica"><!-- pelvis pictogram, Dolor pélvico o varices vulvares, Congestión pélvica, arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop row-pelvica); a control need not have button chrome --></div>
  <div class="r-row-caminar region control" data-region="row-caminar"><!-- walking pictogram, Me duele al caminar, Mala circulación, arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop row-caminar); a control need not have button chrome --></div>
  <div class="r-row-pie region control" data-region="row-pie"><!-- foot pictogram, Una herida en el pie que no cura, Pie diabético, arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop row-pie); a control need not have button chrome --></div>
  <div class="r-row-prueba region control" data-region="row-prueba"><!-- report pictogram, Me han encontrado algo en una prueba, Aorta dilatada, placas en la carótida, arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop row-prueba); a control need not have button chrome --></div>
  <div class="r-row-urgencias region control" data-region="row-urgencias"><!-- coral red row, alarm pictogram, Pierna hinchada de golpe, Urgencias, arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop row-urgencias); a control need not have button chrome --></div>
  <div class="r-routes region chrome" data-region="routes"><!-- five light-blue and one red route lines with white flow dashes curving down --></div>
</main>
</body>
</html>
